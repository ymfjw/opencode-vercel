<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever中转 — 使用 TOKEN forever</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #0a0a0a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border: 1px solid #333; border-radius: 16px; padding: 48px; max-width: 520px; width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); position: relative; z-index: 10; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 16px; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        p { color: #999; line-height: 1.8; font-size: 14px; margin-bottom: 24px; }
        .badge { display: inline-block; background: rgba(102, 126, 234, 0.1); color: #667eea; border: 1px solid rgba(102, 126, 234, 0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .bg-glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(102,126,234,0.15) 0%, rgba(0,0,0,0) 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; pointer-events: none; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="card">
        <h1>Forever 中转站</h1>
        <p>高速稳定的 AI API 中转服务<br>支持 OpenAI / Claude / DeepSeek 全系列模型</p>
        <span class="badge">🔒 仅限授权用户</span>
    </div>
</body>
</html>
